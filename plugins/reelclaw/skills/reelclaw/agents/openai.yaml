interface:
  display_name: "DansUGC ReelClaw"
  short_description: "UGC reaction + demo ads for this repo, edited and rendered locally with HyperFrames"
  brand_color: "#111111"
  default_prompt: "$reelclaw: Make 3 UGC ads for this project."

dependencies:
  tools:
    - type: "mcp"
      value: "dansugc"
      description: "DansUGC MCP server (clip library, viral formats, trending music, research, posting tools); OAuth only, log in with `codex mcp login dansugc`"
      transport: "streamable_http"
      url: "https://dansugc.com/mcp"
